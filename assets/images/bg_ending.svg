<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Ending scene - lighter atmosphere -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5a7a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6a7a9a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <!-- Sun/Moon -->
  <circle cx="650" cy="120" r="60" fill="#fafad0" opacity="0.8"/>

  <!-- Ground -->
  <rect x="0" y="400" width="800" height="200" fill="#3a4a3a"/>

  <!-- Simple tree silhouettes -->
  <ellipse cx="150" cy="350" rx="80" ry="100" fill="#2a3a2a"/>
  <rect x="140" y="400" width="20" height="100" fill="#1a2a1a"/>
  <ellipse cx="700" cy="370" rx="60" ry="80" fill="#2a3a2a"/>
  <rect x="690" y="400" width="20" height="100" fill="#1a2a1a"/>
</svg>
