<svg xmlns="http://www.w3.org/2000/svg" width="300" height="500" viewBox="0 0 300 500">
  <!-- Character silhouette - abstract human shape -->
  <defs>
    <linearGradient id="charGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a3a5a;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#2a4a6a;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#1a3a5a;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- Head -->
  <ellipse cx="150" cy="80" rx="50" ry="60" fill="url(#charGrad)"/>

  <!-- Body -->
  <ellipse cx="150" cy="220" rx="70" ry="120" fill="url(#charGrad)"/>

  <!-- Arms -->
  <ellipse cx="90" cy="200" rx="25" ry="90" fill="url(#charGrad)" transform="rotate(-20 90 200)"/>
  <ellipse cx="210" cy="200" rx="25" ry="90" fill="url(#charGrad)" transform="rotate(20 210 200)"/>

  <!-- Legs -->
  <ellipse cx="120" cy="390" rx="30" ry="110" fill="url(#charGrad)"/>
  <ellipse cx="180" cy="390" rx="30" ry="110" fill="url(#charGrad)"/>
</svg>
